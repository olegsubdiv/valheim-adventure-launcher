name: Build Windows launcher
on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version
        required: true
        default: '0.1.0'
  push:
    tags: ['app-v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Select version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } elseif ($env:GITHUB_REF_NAME -like 'app-v*') { $env:GITHUB_REF_NAME.Substring(5) } else { '0.1.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid application version' }
          "LAUNCHER_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, regressions and desktop smoke check
        shell: pwsh
        run: .\build\Build.ps1 -Version $env:LAUNCHER_BUILD_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adventure-launcher-windows
          path: |
            artifacts/releases/*
            artifacts/build/**/build-receipt.json
            artifacts/build/**/desktop-self-test.txt
            artifacts/build/**/desktop-preview*.png
          if-no-files-found: error
